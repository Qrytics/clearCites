services:
  # ── Neo4j graph database ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: clearcites-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-clearcites}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Graph API (FastAPI) ─────────────────────────────────────────────────
  graph_api:
    build:
      context: .
      dockerfile: services/graph_api/Dockerfile
    container_name: clearcites-api
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-clearcites}"
      SEMANTIC_SCHOLAR_API_KEY: "${SEMANTIC_SCHOLAR_API_KEY:-}"
      OPENALEX_MAILTO: "${OPENALEX_MAILTO:-}"
      CROSSREF_MAILTO: "${CROSSREF_MAILTO:-}"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./data_pipeline:/app/data_pipeline

  # ── React frontend (Next.js) ────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # The runner stage sets NODE_ENV=production, which makes `next dev` skip CSS loaders
      # and produce "Module parse failed" errors on global stylesheets. Build the deps stage instead
      # (node_modules pre-installed, no NODE_ENV override) and run the dev server on top of it.
      target: deps
    container_name: clearcites-web
    environment:
      NODE_ENV: "development"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_BASE_PATH: ""
    # Source is bind-mounted below, so any `.next` baked into the image would be hidden anyway.
    # Use the dev server in Compose; for a prod-style run, drop the bind mount and target the runner stage.
    command: ["npm", "run", "dev:docker"]
    ports:
      - "3000:3000"
    depends_on:
      - graph_api
    volumes:
      - ./web:/app
      - /app/node_modules
      # Keep Next dev output off the bind mount (avoids ENOENT / broken .next on the host).
      - clearcites_web_next:/app/.next

volumes:
  neo4j_data:
  neo4j_logs:
  clearcites_web_next:
